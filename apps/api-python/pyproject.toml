[project]
name = "api-python"
version = "0.0.0"
description = "FastAPI mirror of @repo/api"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlmodel>=0.0.22",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.8.0",
  "email-validator>=2.2.0",
  "pwdlib[argon2]>=0.2.0",
  "pyjwt[crypto]>=2.10.0",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "httpx>=0.28.0",
  "ruff>=0.11.0",
  "mypy>=1.15.0",
  "types-PyJWT>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app.modules.auth.service --cov=app.modules.health.service --cov=app.lib.errors --cov=app.lib.tokens --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[[tool.mypy.overrides]]
module = ["slowapi.*", "pwdlib.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
